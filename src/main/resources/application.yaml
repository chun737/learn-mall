spring:
  application:
    name: demo1
  datasource:
    username: root
    password: ${DB_PASSWORD}
    url: jdbc:mysql://localhost:3306/ecommerce_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    driver-class-name: com.mysql.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      # database: 0
  servlet:
    multipart:
      max-file-size: 10MB          # 单文件上限（覆盖默认 1MB，与 OSS 5MB 校验留有裕量）
      max-request-size: 10MB       # 单次请求总大小


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-aliases-package: com.mall.vo
  global-config:
    db-config:
      id-type: auto # 全局id类型为自增长

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql        # 数据库方言
  reasonable: true             # 页码合理化：pageNum<=0 查第一页，超过最大页查最后一页
  support-methods-arguments: true
jwt:
  # 签名密钥，长度必须 >= 32 字节，从环境变量 JWT_SECRET 读取
  secret: ${JWT_SECRET}
  # token 有效期（毫秒），默认 7 天
  expire-time: 604800000
alipay:
  app-id:


# 雪花 ID 机器号：多实例部署时每个实例必须不同（0~1023）
snowflake:
  worker-id: 1

# 阿里云 OSS：图片上传/读取，密钥走环境变量（与 DB_PASSWORD / JWT_SECRET 同规范，防明文）
oss:
  endpoint: ${OSS_ENDPOINT}            # 地域节点，如 https://oss-cn-hangzhou.aliyuncs.com
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  bucket-name: ${OSS_BUCKET_NAME}      # 如 mall-images
  url-prefix: ${OSS_URL_PREFIX:}       # 自定义域名（可选），留空则自动拼 https://{bucket}.{endpoint}
