spring:
  application:
    name: demo1
  datasource:
    username: root
    password: hongye
    url: jdbc:mysql://localhost:3306/ecommerce_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    driver-class-name: com.mysql.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      # password: 你的密码
      # database: 0


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-aliases-package: com.mall.vo
  global-config:
    db-config:
      id-type: auto # 全局id类型为自增长

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql        # 数据库方言
  reasonable: true             # 页码合理化：pageNum<=0 查第一页，超过最大页查最后一页
  support-methods-arguments: true
jwt:
  # 签名密钥，长度必须 >= 32 字节，生产环境务必替换并放入环境变量
  secret: mall-jwt-secret-key-please-change-me-2026
  # token 有效期（毫秒），默认 7 天
  expire-time: 604800000
alipay:
  app-id:


# 雪花 ID 机器号：多实例部署时每个实例必须不同（0~1023）
snowflake:
  worker-id: 1
