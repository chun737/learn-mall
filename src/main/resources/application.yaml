spring:
  application:
    name: demo1
  datasource:
    username: root
    password: ${DB_PASSWORD}
    url: jdbc:mysql://localhost:3306/ecommerce_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # MySQL 8 驱动类名（旧类名 com.mysql.jdbc.Driver 已废弃，仅靠兼容层才不报错）
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      # database: 0
  servlet:
    multipart:
      max-file-size: 10MB          # 单文件上限（覆盖默认 1MB，与 OSS 5MB 校验留有裕量）
      max-request-size: 10MB # 单次请求总大小
  elasticsearch:
    uris: http://192.168.10.8:9200
    connection-timeout: 5s
    socket-timeout: 30s


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl  # SQL 日志走 slf4j（DEBUG 级才输出，默认 INFO 关闭）；原先 StdOutImpl 每条 SQL 同步刷控制台，压测吞吐损失大
  type-aliases-package: com.mall.vo
  global-config:
    db-config:
      id-type: auto # 全局id类型为自增长
      # 全局逻辑删除：MP 内置方法（selectById/selectOne/selectList/deleteById...）自动追加 deleted 过滤/改写。
      # 只对"实体里有 deleted 属性"的表生效（Cart/OrderItem/Payment/StockLog 无此字段，仍是物理删除）；
      # 手写 XML 不受本配置影响，须自己带 deleted = 0 条件
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ⭐ 排查用（默认关闭）：需要时取消下面三行注释，控制台会打印每条 SQL 及其参数，
#   定位"卡在哪一步"最有效。排查完记得再注释掉 —— DEBUG 级日志量很大，压测时会明显拖慢吞吐。
# logging:
#   level:
#     com.mall.mapper: debug

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql        # 数据库方言
  reasonable: true             # 页码合理化：pageNum<=0 查第一页，超过最大页查最后一页
  support-methods-arguments: true
jwt:
  # 签名密钥，长度必须 >= 32 字节，从环境变量 JWT_SECRET 读取
  secret: ${JWT_SECRET}
  # token 有效期（毫秒），默认 7 天
  expire-time: 604800000
alipay:
  app-id:


# 雪花 ID 机器号：多实例部署时每个实例必须不同（0~1023）
snowflake:
  worker-id: 1

# 阿里云 OSS：图片上传/读取，密钥走环境变量（与 DB_PASSWORD / JWT_SECRET 同规范，防明文）
oss:
  endpoint: ${OSS_ENDPOINT}            # 地域节点，如 https://oss-cn-hangzhou.aliyuncs.com
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  bucket-name: ${OSS_BUCKET_NAME}      # 如 mall-images
  url-prefix: ${OSS_URL_PREFIX:}       # 自定义域名（可选），留空则自动拼 https://{bucket}.{endpoint}

# RocketMQ：秒杀订单异步链路（SeckillActivityServiceImpl 发消息 / SeckillOrderConsumer 消费）
# 地址指向虚拟机上的 NameServer；Docker 启动时只要端口映射不变（9876:9876），此处无需改动
rocketmq:
  name-server: 192.168.10.8:9876
  producer:
    # 发送者组名：同一应用内唯一即可，多实例部署时同组必须一致
    group: mall-producer

